{% extends "base.html" %}
{% load crispy_forms_tags %}
{% block title %}Registrieren – MyFest{% endblock %}
{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-6">
        <div class="card shadow">
            <div class="card-body p-4">
                <h2 class="card-title mb-4">👤 Konto erstellen</h2>
                <form method="post">
                    {% csrf_token %}
                    {{ form|crispy }}
                    <button type="submit" class="btn btn-success w-100 mt-2">Registrieren</button>
                </form>
                <hr>
                <p class="text-center mb-0">Bereits registriert? <a href="{% url 'login' %}">Login</a></p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
