{% extends "base.html" %}
{% load crispy_forms_tags %}
{% block title %}Login – MyFest{% endblock %}
{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-5">
        <div class="card shadow">
            <div class="card-body p-4">
                <h2 class="card-title mb-4">🔐 Login</h2>
                <form method="post">
                    {% csrf_token %}
                    {{ form|crispy }}
                    <button type="submit" class="btn btn-primary w-100 mt-2">Einloggen</button>
                </form>
                <hr>
                <p class="text-center mb-0">Noch kein Konto? <a href="{% url 'register' %}">Registrieren</a></p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
