<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}MyFest{% endblock %}</title>
    <link href="[cdn.jsdelivr.net](https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css)" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand fw-bold" href="/">🎪 MyFest</a>
        <div class="ms-auto d-flex gap-2">
            {% if user.is_authenticated %}
                <a href="{% url 'dashboard' %}" class="btn btn-sm btn-outline-light">Dashboard</a>
                <a href="{% url 'event_list' %}" class="btn btn-sm btn-outline-light">Events</a>
                {% if user.is_staff %}
                    <a href="/admin/" class="btn btn-sm btn-outline-warning">Admin</a>
                {% endif %}
                <a href="{% url 'logout' %}" class="btn btn-sm btn-danger">Logout</a>
            {% else %}
                <a href="{% url 'login' %}" class="btn btn-sm btn-outline-light">Login</a>
                <a href="{% url 'register' %}" class="btn btn-sm btn-primary">Registrieren</a>
            {% endif %}
        </div>
    </div>
</nav>

<div class="container mt-4">
    {% for message in messages %}
        <div class="alert alert-{{ message.tags|default:'info' }} alert-dismissible fade show" role="alert">
            {{ message }}
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
    {% endfor %}
    {% block content %}{% endblock %}
</div>

<script src="[cdn.jsdelivr.net](https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js)"></script>
</body>
</html>
